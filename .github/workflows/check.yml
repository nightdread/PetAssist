name: Check addon

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 test runtime
        run: python -m pip install lupa==2.8
      - name: Run addon regressions
        run: python tests/run.py
