name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: python -m pip install lupa==2.8

      - name: Package Classic without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -g classic -r ./.release/classic

      - name: Package Forever without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -g forever -r ./.release/forever

      - name: Validate packaged addon
        shell: bash
        run: |
          shopt -s nullglob
          classic=(.release/classic/*-classic.zip)
          forever=(.release/forever/*-forever.zip)
          if (( ${#classic[@]} != 1 || ${#forever[@]} != 1 )); then
            echo "Expected one Classic archive and one Forever archive"
            exit 1
          fi
          for archive in "${classic[@]}" "${forever[@]}"; do
            python tests/run.py --archive "$archive"
          done

      # These uploads must remain sequential: the packager merges release.json
      # into the existing GitHub release and concurrent updates can lose assets.
      - name: Upload validated Classic package contents
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o -g classic -r ./.release/classic

      - name: Upload validated Forever package contents
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o -g forever -r ./.release/forever
